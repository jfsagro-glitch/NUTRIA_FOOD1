<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f1e9"/>
      <stop offset="1" stop-color="#e8e2d4"/>
    </linearGradient>

    <linearGradient id="nGrad" x1="0.1" y1="0" x2="0.75" y2="1">
      <stop offset="0" stop-color="#2c7a76"/>
      <stop offset="0.5" stop-color="#166061"/>
      <stop offset="1" stop-color="#0a4245"/>
    </linearGradient>

    <linearGradient id="leafBud" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6f2e8"/>
      <stop offset="1" stop-color="#9adcc9"/>
    </linearGradient>

    <linearGradient id="leafMid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e6a78"/>
      <stop offset="1" stop-color="#0d4854"/>
    </linearGradient>

    <linearGradient id="leafBig" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7fe0c4"/>
      <stop offset="0.55" stop-color="#2bab8f"/>
      <stop offset="1" stop-color="#0e7263"/>
    </linearGradient>

    <filter id="shadow" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="4" dy="8" stdDeviation="6" flood-color="#0a2e2e" flood-opacity="0.32"/>
    </filter>
    <filter id="shadowSm" x="-60%" y="-60%" width="220%" height="220%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#0a2e2e" flood-opacity="0.3"/>
    </filter>
  </defs>


  <!-- Буква N — курсивный засечковый шрифт (чёткая, читаемая форма) -->
  <g filter="url(#shadow)">
    <text x="70" y="378" font-family="Liberation Serif, Georgia, serif" font-style="italic"
          font-weight="700" font-size="360" fill="url(#nGrad)">N</text>

    <!-- Росчерк-хвост, продолжающий нижний правый штрих N вправо-вниз closing curl -->
    <path d="
      M 292 300
      C 320 316 338 334 340 352
      C 342 368 330 378 312 374
      C 300 371 292 362 290 350
    " stroke="url(#nGrad)" stroke-width="14" stroke-linecap="round" fill="none"/>
  </g>

  <!-- Маленький отдельный лепесток у кончика росчерка -->
  <g filter="url(#shadowSm)">
    <path d="
      M 356 356
      C 368 348 380 350 386 360
      C 392 370 388 384 376 394
      C 366 402 354 400 350 388
      C 347 379 349 365 356 356 Z
    " fill="url(#nGrad)"/>
  </g>

  <!-- Бутон (самый светлый, самый левый и короткий) -->
  <g filter="url(#shadowSm)" transform="translate(208,150) rotate(-9)">
    <path d="M28 0 C43 15 53 35 53 56 C53 76 42 90 28 90 C14 90 3 76 3 56 C3 35 13 15 28 0 Z" fill="url(#leafBud)"/>
    <path d="M28 12 L28 80" stroke="#5fc0a6" stroke-width="2.5" fill="none" opacity="0.55"/>
  </g>

  <!-- Узкий тёмный лист, направлен вверх, за бутоном -->
  <g filter="url(#shadow)" transform="translate(264,94) rotate(5)">
    <path d="M36 0 C58 24 70 55 68 88 C66 116 50 136 28 132 C8 128 -2 104 4 76 C10 50 20 22 36 0 Z" fill="url(#leafMid)"/>
    <path d="M36 18 C31 54 26 94 22 128" stroke="#062327" stroke-width="3" fill="none" opacity="0.45"/>
  </g>

  <!-- Большой лист (главный, самый яркий), направлен вправо-вверх -->
  <g filter="url(#shadow)" transform="translate(292,178) rotate(26)">
    <path d="M0 42 C34 10 78 -8 122 0 C126 42 108 84 74 106 C46 124 12 118 2 92 C-4 76 -6 58 0 42 Z" fill="url(#leafBig)"/>
    <path d="M12 88 C46 64 80 40 112 14" stroke="#0a3c37" stroke-width="4" fill="none" opacity="0.4"/>
  </g>
</svg>
